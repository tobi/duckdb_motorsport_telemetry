version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: aim-telemetry
      - dependency-name: cosworth-telemetry
      - dependency-name: motec-telemetry
      - dependency-name: motorsport-telemetry-core
      - dependency-name: telemetry
      - dependency-name: telemetry-format
      - dependency-name: racelogic-telemetry
    groups:
      motorsport-telemetry-rs:
        patterns:
          - aim-telemetry
          - cosworth-telemetry
          - motec-telemetry
          - motorsport-telemetry-core
          - telemetry
          - telemetry-format
          - racelogic-telemetry
