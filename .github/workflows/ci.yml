name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm-extension
      - uses: oven-sh/setup-bun@v2
      - name: Build WASM extension
        run: scripts/build_wasm_extension.sh
      - name: Build and test browser lab
        run: |
          mkdir -p web/public/v1.5.4/wasm_eh web/public/v1.5.4/wasm_mvp
          cp build/wasm/wasm_eh/motorsport_telemetry.duckdb_extension.wasm web/public/v1.5.4/wasm_eh/
          cp build/wasm/wasm_mvp/motorsport_telemetry.duckdb_extension.wasm web/public/v1.5.4/wasm_mvp/
          cd web
          bun install --frozen-lockfile
          bun run build
          bunx vite preview --host 127.0.0.1 --port 4173 &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          CHROME=/usr/bin/google-chrome node tests/smoke.mjs

  community-extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Build with DuckDB Community Extension tooling
        run: |
          make DUCKDB_PLATFORM=linux_amd64 TARGET_DUCKDB_VERSION=v2.0.0 configure
          make DUCKDB_PLATFORM=linux_amd64 TARGET_DUCKDB_VERSION=v2.0.0 release
          make DUCKDB_PLATFORM=linux_amd64 TARGET_DUCKDB_VERSION=v2.0.0 SKIP_TESTS=0 test_release

  duckdb-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: tobi/motorsport-telemetry-rs
          ref: 7cb37dc61eeb343d99eeeb27a786970ff2ec26bc
          path: tests/fixtures/telemetry-rs
          sparse-checkout: tests/fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install DuckDB CLI
        run: |
          curl --fail -L -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb.tar.gz
          chmod +x duckdb
          echo "$PWD" >> "$GITHUB_PATH"
      - run: make integration-test
