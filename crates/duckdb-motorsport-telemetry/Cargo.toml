[package]
name = "duckdb-motorsport-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DuckDB extension for AiM MP4, PDS, MoTeC LD, VBOX VBO and .telemetry recordings"

[lib]
name = "motorsport_telemetry"
crate-type = ["cdylib", "rlib"]

[dependencies]
motorsport-telemetry-core.workspace = true
cosworth-telemetry.workspace = true
motec-telemetry.workspace = true
racelogic-telemetry.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
duckdb-neo = { git = "https://github.com/duckdb/duckdb-rs", rev = "e1b0940dfddd575c43fe4e2f070d47ee53d419cd", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { git = "https://github.com/duckdb/duckdb-rs", rev = "e1b0940dfddd575c43fe4e2f070d47ee53d419cd", features = ["neo"] }
glob = "0.3"
thiserror.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
aim-telemetry.workspace = true
telemetry-format.workspace = true
telemetry.workspace = true
