[workspace]
resolver = "2"
members = [
    "crates/duckdb-motorsport-telemetry",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tobi/duckdb_motorsport_telemetry"

[workspace.dependencies]
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
telemetry = { package = "motorsport-telemetry", git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "7cb37dc61eeb343d99eeeb27a786970ff2ec26bc" }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
