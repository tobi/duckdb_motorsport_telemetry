[workspace]
resolver = "2"
members = [
    "crates/duckdb-motorsport-telemetry",
]

[workspace.package]
version = "1.3.4"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/tobi/duckdb_motorsport_telemetry"

[workspace.dependencies]
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
motorsport-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", tag = "v1.3.4" }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
