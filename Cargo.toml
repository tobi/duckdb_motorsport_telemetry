[workspace]
resolver = "2"
members = [
    "crates/duckdb-motorsport-telemetry",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/tobi/duckdb_motorsport_telemetry"

[workspace.dependencies]
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", branch = "master" }
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", branch = "master" }
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", branch = "master" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", branch = "master" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", branch = "master" }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
