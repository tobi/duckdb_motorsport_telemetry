[workspace]

[package]
name = "duckdb-motorsport-telemetry-wasm"
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/unused_lib.rs"

[[example]]
name = "motorsport_telemetry"
crate-type = ["staticlib"]
path = "src/wasm_lib.rs"

[dependencies]
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "72224ca366f13e97857d7515506e5f52abb9ae39" }
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "72224ca366f13e97857d7515506e5f52abb9ae39" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "72224ca366f13e97857d7515506e5f52abb9ae39" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "72224ca366f13e97857d7515506e5f52abb9ae39" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
duckdb = { version = "=1.10504.0", features = [
    "vtab-loadable",
    "loadable-extension",
    "vscalar",
] }
duckdb-loadable-macros = "=1.10504.0"
glob = "0.3"
libduckdb-sys = { version = "=1.10504.0", features = ["loadable-extension"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
