[workspace]

[package]
name = "duckdb-motorsport-telemetry-wasm"
version = "1.3.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/unused_lib.rs"

[[example]]
name = "motorsport_telemetry"
crate-type = ["staticlib"]
path = "src/wasm_lib.rs"

# DuckDB-Wasm currently embeds 1.5.4. Keep its last compatible extension
# frozen; a v2 build must wait for a DuckDB-Wasm 2.0 runtime.
[dependencies]
telemetry-extension-v1 = { package = "duckdb-motorsport-telemetry", git = "https://github.com/tobi/duckdb_motorsport_telemetry", rev = "4eb038b5d7e7cdadc758cd4d4e7e7fbf890e052a" }
libduckdb-sys = { version = "=1.10504.0", features = ["loadable-extension"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
